# TMDB ingest: builds data/movies.json on GitHub Actions (the index is too
# big to build on machines where the ISP blocks api.themoviedb.org).
#
# Triggers: manual (Actions tab) + weekly schedule. Needs the repo secret
# TMDB_API_KEY (Settings > Secrets and variables > Actions).
# Only data/movies.json is ever committed; progress/log files stay local.
name: ingest-tmdb

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ingest (exit code captured, never fails here)
        id: ingest
        run: |
          set +e
          npm run ingest:tmdb 2>&1 | tee ingest.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: ingest.log

      - name: Upload partial index when coverage unmet (exit 2)
        if: steps.ingest.outputs.exit_code == '2'
        uses: actions/upload-artifact@v4
        with:
          name: partial-movies
          path: |
            data/movies.json
            ingest.log

      - name: Commit refreshed index
        if: steps.ingest.outputs.exit_code == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/movies.json
          if git diff --cached --quiet; then
            echo "movies.json unchanged, nothing to commit"
          else
            git commit -m "chore: refresh movie index"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Fail on ingest error
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "ingest exited with code ${{ steps.ingest.outputs.exit_code }} (2 = coverage unmet, index NOT committed; 3/1 = unreachable or error)"
          exit 1
