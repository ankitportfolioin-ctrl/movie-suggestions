# TMDB global ingest: upserts titles straight into Postgres (no data file).
#
# Triggers: manual (Actions tab) + weekly schedule. Needs repo secrets
# TMDB_API_KEY and DATABASE_URL (Settings > Secrets and variables > Actions).
# Nothing is ever committed; progress lives in the database (tmdbIds already
# present are skipped), so re-runs and limit-capped test runs are safe.
# Manual dialog: mode=ingest|dry-run|backfill-cert, types=movie,short,series,
# years=2000-2026, limit=N (first test: limit 50).
name: ingest-tmdb

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest = add new titles; dry-run = count only (writes nothing); backfill-cert = fill certificate/minAge where minAge is NULL; sample = test run without writes; ingest-export-movies/series = download TMDB daily exports; supplement-movies/series = language pass via discover"
        required: false
        default: "ingest"
        type: choice
        options:
          - ingest
          - dry-run
          - backfill-cert
          - sample
          - ingest-export-movies
          - ingest-export-series
          - supplement-movies
          - supplement-series
      types:
        description: "Media kinds for ingest/dry-run (movie,short,series)"
        required: false
        default: "movie"
      years:
        description: "Release-year window for ingest/dry-run (e.g. 2000-2026)"
        required: false
        default: "2000-2026"
      limit:
        description: "Max detail fetches this run (0 = no limit)"
        required: false
        default: "0"
      target:
        description: "Target total rows in movies table (default 60000)"
        required: false
        default: "60000"
      sample_size:
        description: "Sample size for sample mode (default 500)"
        required: false
        default: "500"
      force:
        description: "backfill-cert reprocesses rows that already have minAge (fills new columns)"
        required: false
        default: false
        type: boolean
      allow_series:
        description: "Allow writing series rows (required for series modes)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ingest (exit code captured, never fails here)
        id: ingest
        run: |
          set +e
          EXTRA=""
          if [ "${{ inputs.force }}" = "true" ]; then EXTRA="--force"; fi
          if [ "${{ inputs.allow_series }}" = "true" ]; then EXTRA="$EXTRA --allow-series"; fi
          MODE="${{ inputs.mode || 'ingest' }}"
          CMD="npm run ingest:tmdb --"
          if [ "$MODE" = "dry-run" ]; then
            CMD="$CMD --dry-run --types \"${{ inputs.types || 'movie,short,series' }}\" --years \"${{ inputs.years || '2000-2026' }}\""
          elif [ "$MODE" = "sample" ]; then
            CMD="$CMD --mode sample --sample-size \"${{ inputs.sample_size || '500' }}\" --types \"${{ inputs.types || 'movie,series' }}\" --years \"${{ inputs.years || '2000-2026' }}\""
          elif [ "$MODE" = "ingest-export-movies" ] || [ "$MODE" = "ingest-export-series" ] || [ "$MODE" = "supplement-movies" ] || [ "$MODE" = "supplement-series" ]; then
            CMD="$CMD --mode \"$MODE\" --years \"${{ inputs.years || '2000-2026' }}\" --limit \"${{ inputs.limit || '0' }}\" --target \"${{ inputs.target || '60000' }}\" $EXTRA"
          else
            CMD="$CMD --mode \"$MODE\" --types \"${{ inputs.types || 'movie' }}\" --years \"${{ inputs.years || '2000-2026' }}\" --limit \"${{ inputs.limit || '0' }}\" --target \"${{ inputs.target || '60000' }}\" $EXTRA"
          fi
          echo "Running: $CMD"
          eval "$CMD" 2>&1 | tee ingest.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_TIMEOUT_MINUTES: "340"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: ingest.log

      - name: Fail on ingest error
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "ingest exited with code ${{ steps.ingest.outputs.exit_code }} (1 = error, 3 = unreachable/misconfigured; coverage gaps are exit 0 with UNMET lines in the log)"
          exit 1
