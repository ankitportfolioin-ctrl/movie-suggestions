# TMDB global ingest: upserts movies straight into Postgres (no data file).
#
# Triggers: manual (Actions tab) + weekly schedule. Needs repo secrets
# TMDB_API_KEY and DATABASE_URL (Settings > Secrets and variables > Actions).
# Nothing is ever committed; progress lives in the database (tmdbIds already
# present are skipped), so re-runs and limit-capped test runs are safe.
name: ingest-tmdb

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ingest = add new movies; backfill-cert = fill certificate/minAge where minAge is NULL"
        required: false
        default: "ingest"
        type: choice
        options:
          - ingest
          - backfill-cert
      limit:
        description: "Max detail fetches this run (0 = no limit)"
        required: false
        default: "0"
      force:
        description: "backfill-cert reprocesses rows that already have minAge (fills new columns)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run ingest (exit code captured, never fails here)
        id: ingest
        run: |
          set +e
          EXTRA=""
          if [ "${{ inputs.force }}" = "true" ]; then EXTRA="--force"; fi
          npm run ingest:tmdb -- --mode "${{ inputs.mode || 'ingest' }}" --limit "${{ inputs.limit || '0' }}" $EXTRA 2>&1 | tee ingest.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOB_TIMEOUT_MINUTES: "340"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: ingest.log

      - name: Fail on ingest error
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "ingest exited with code ${{ steps.ingest.outputs.exit_code }} (1 = error, 3 = unreachable/misconfigured; coverage gaps are exit 0 with UNMET lines in the log)"
          exit 1
